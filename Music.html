<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css?v=0.3">
  <link rel="icon" type="image/x-icon" href="ytlogo.png">
  <title>Gathows Music</title>
</head>

<body id="home">
  <div id="background"></div>

  <div class="topnav">
    <a href="index.html">Home</a>
    <a href="Essays.html">Essays</a>
    <a class="active" href="Music.html">Music</a>
    <a href="Video.html">Videos</a>
  </div>

  <div class="Musicbuttons">
    <a href="https://open.spotify.com/album/7MaMQIpQGO8xTvF1SKYijG?si=8lOg2fNZRomzckT4w2UPDA">
      <img src="aintnoasda.png" alt="Aint no asda">
      <p>Aint no asda - George2Trappy</p>
    </a>

    <a href="https://open.spotify.com/track/3QlrcOrQIekdR3lrk54pgj?si=75f7971eb89c45d0">
      <img src="scienceiscool.png" alt="Science is cool">
      <p>Science is cool - George2Trappy</p>
    </a>
  </div>

  <script>
    async function loadBackground() {
      try {
        const response = await fetch(
          "https://science.nasa.gov/wp-json/wp/v2/apod-basic?per_page=1&orderby=date&order=desc"
        );

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const data = await response.json();
        const apod = data[0];

        if (!apod || apod.media_type !== "image") {
          console.log("Today's APOD is not an image.");
          return;
        }

        const imageUrl = apod.hdurl || apod.url;
        const background = document.querySelector("#background");

        background.style.backgroundImage = `url("${imageUrl}")`;
      } catch (error) {
        console.error("Could not load NASA background:", error);
      }
    }

    loadBackground();
  </script>
</body>
</html>
